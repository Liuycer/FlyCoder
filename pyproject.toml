[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flycoder"
version = "0.2.0"
description = "Experimental connectome policy / LLM coding executor prototype"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
flycoder = "flycoder.__main__:main"

[tool.setuptools.packages.find]
include = ["flycoder*"]

[tool.setuptools.package-data]
flycoder = [
  "examples/buggy_repo/calculator.py",
  "examples/buggy_repo/tests/test_calculator.py",
]
