name: FlyCoder checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m flycoder demo
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -c "import zipfile,glob; p=glob.glob('dist/*.whl')[0]; names=set(zipfile.ZipFile(p).namelist()); assert 'flycoder/examples/buggy_repo/calculator.py' in names"
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: cd /tmp && flycoder demo --mock-first-pass
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build --abort-on-container-exit --exit-code-from flycoder
