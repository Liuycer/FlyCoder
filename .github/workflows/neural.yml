name: FlyCoder neural Linux check

on:
  workflow_dispatch:

jobs:
  linux-neural:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install native compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Prepare and validate MaleCNS backend
        run: bash scripts/setup_neural.sh
      - name: Replay fixed cross-platform inputs and mapping
        run: .venv-neural/bin/python scripts/replay_neural.py
      - name: Run offline real-connectome demo
        run: ./run-neural.sh --llm mock --seed 0 --runs research/ci-neural-runs || true
      - name: Validate real-connectome execution
        if: always()
        run: python scripts/check_neural_run.py --runs research/ci-neural-runs --report research/neural-run-check.json
      - name: Show run records
        if: always()
        run: |
          shopt -s nullglob
          for f in research/ci-neural-runs/*/summary.json research/ci-neural-runs/*/events.jsonl; do
            echo "===== $f"
            cat "$f"
          done
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flycoder-neural-validation
          path: |
            research/controlled-replay.json
            research/neural-validation.json
            research/upstream-lock.json
            research/neural-probe.json
            research/neural-run-check.json
            research/neural-map.json
            vendor/doomfly/outputs/doom/libneural.so.json
            research/ci-neural-runs/*/summary.json
            research/ci-neural-runs/*/events.jsonl
          if-no-files-found: warn
